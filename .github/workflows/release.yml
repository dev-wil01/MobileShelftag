name: Release (signed APK + GitHub Release)

# Runs on every push to main/master, and on demand (Actions > "Release" > Run workflow).
# It builds the SIGNED app and publishes it as a GitHub Release, which is what the handheld's
# "Check for updates" looks at. Needs four repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# The keystore is created on YOUR computer and is never committed (see tools/New-SigningKey.ps1).
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write   # needed only to create the GitHub Release; no other permission is granted

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # Version: the build number is the app's versionCode, so every release is newer than the last.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      # Where the app looks for updates (this repository's latest Release).
      UPDATE_REPO: ${{ github.repository }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Stop early if a signing secret is missing
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set."; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the screens
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: Guard - no localhost addresses or embedded secrets
        run: |
          set -u
          if grep -rEnI "https?://(localhost|127\.[0-9]+\.[0-9]+\.[0-9]+|0\.0\.0\.0|10\.0\.2\.2)" src android/app/src/main dist; then
            echo "::error::A localhost-style URL was found in the app source or build output."
            exit 1
          fi
          if grep -rEnI "(-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16})" . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "::error::Something that looks like a private key or access token is in the repository."
            exit 1
          fi
          echo "Guard passed."

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # GitHub's ubuntu runners already ship the Android SDK (ANDROID_HOME). The separate
      # android-actions/setup-android step failed while downloading newer command-line tools,
      # so it is not used. Packages are installed only if they are missing.
      - name: Make sure Android SDK platform 34 is present
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          if [ -d "$ANDROID_HOME/platforms/android-34" ] && [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            echo "Platform 34 and build-tools 34.0.0 are already installed."
          else
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Decode the keystore (kept only on this temporary runner)
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run the unit tests and build the signed release APK
        working-directory: android
        run: gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Verify the signature and name the file
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          mkdir -p out
          cp "$APK" out/MobileShelfTag.apk

      - name: Publish the GitHub Release
        run: |
          TAG="v${VERSION_NAME}"
          NOTES="${COMMIT_MESSAGE:-Manual build}"
          gh release create "$TAG" out/MobileShelfTag.apk \
            --target "$GITHUB_SHA" \
            --title "MobileShelfTag ${VERSION_NAME}" \
            --notes "$NOTES" \
            --latest
