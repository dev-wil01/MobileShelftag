name: Build signed release APK (optional, manual)

# Manual only: GitHub > Actions > "Build signed release APK" > Run workflow.
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# The keystore is created on YOUR computer and is never committed. See README, section "Signed release".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Stop early if a signing secret is missing
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set."; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the screens
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # GitHub's ubuntu runners already ship the Android SDK (ANDROID_HOME). The separate
      # android-actions/setup-android step failed while downloading newer command-line tools,
      # so it is not used. Packages are installed only if they are missing.
      - name: Make sure Android SDK platform 34 is present
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          if [ -d "$ANDROID_HOME/platforms/android-34" ] && [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            echo "Platform 34 and build-tools 34.0.0 are already installed."
          else
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Decode the keystore (kept only on this temporary runner)
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify the signature
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          mkdir -p out
          cp "$APK" "out/MobileShelfTag-release-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MobileShelfTag-release-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
